<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة المحمية | مؤسسة الشبيب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; background-color: #0b1329; color: #f8fafc; } </style>
</head>
<body class="p-4 md:p-8 max-w-5xl mx-auto">

    <!-- Auth Lock Modal -->
    <div id="authOverlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full text-center shadow-2xl">
            <div class="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl border border-amber-500/20">
                <i class="fas fa-lock"></i>
            </div>
            <h2 class="text-xl font-black text-white mb-1">لوحة تحكم الشبيب المحمية</h2>
            <p class="text-xs text-slate-400 mb-6">يرجى إدخال كلمة المرور للوصول لإدارة المنتجات</p>
            
            <form onsubmit="verifyAdmin(event)" class="space-y-4">
                <input type="password" id="adminPass" placeholder="كلمة المرور السرية" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-center text-white focus:outline-none focus:border-amber-400 text-sm">
                <p id="authError" class="text-red-400 text-xs hidden">كلمة المرور غير صحيحة!</p>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition text-xs">دخول للوحة التحكم</button>
            </form>
        </div>
    </div>

    <!-- Protected Content -->
    <div id="adminContent" class="hidden">
        <div class="flex items-center justify-between border-b border-slate-800 pb-6 mb-8">
            <div>
                <h1 class="text-2xl font-black text-amber-400">إدارة منتجات المتجر | ALSHBIB</h1>
                <p class="text-xs text-slate-400">يمكنك إضافة، تعديل، وحذف منتجات المتجر فورياً</p>
            </div>
            <div class="flex gap-3">
                <a href="index.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                    <i class="fas fa-external-link-alt"></i> فتح المتجر
                </a>
                <button onclick="logoutAdmin()" class="bg-red-500/20 text-red-400 hover:bg-red-500/30 px-3 py-2 rounded-xl text-xs font-bold transition">خروج</button>
            </div>
        </div>

        <div class="grid md:grid-cols-3 gap-8">
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 h-fit">
                <h2 class="text-lg font-bold text-white mb-4"><i class="fas fa-plus-circle text-amber-400"></i> إضافة منتج جديد</h2>
                <form id="productForm" onsubmit="saveProduct(event)" class="space-y-4 text-xs">
                    <div>
                        <label class="block text-slate-400 mb-1">اسم المنتج</label>
                        <input type="text" id="pName" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">التصنيف</label>
                        <select id="pCat" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-400">
                            <option value="inverter">أنفرتر MUST</option>
                            <option value="panel">لوح شمسي</option>
                            <option value="battery">بطارية</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-slate-400 mb-1">السعر الأصلي ($)</label>
                            <input type="number" id="pOrig" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-400">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">السعر بعد الخصم ($)</label>
                            <input type="number" id="pDisc" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-400">
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">رابط الصورة (URL)</label>
                        <input type="url" id="pImg" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">شارة العرض (اختياري)</label>
                        <input type="text" id="pBadge" placeholder="مثال: خصم 15% / جديد" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-400">
                    </div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition">حفظ ونشر للمتجر</button>
                </form>
            </div>

            <div class="md:col-span-2 bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <h2 class="text-lg font-bold text-white mb-4"><i class="fas fa-boxes text-amber-400"></i> قائمة المنتجات الحالية</h2>
                <div id="adminProductsList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        const SECRET_PASS = "1990"; // يمكنك تغيير كلمة المرور السرية هنا

        function verifyAdmin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPass').value;
            if (pass === SECRET_PASS) {
                sessionStorage.setItem('alshbib_admin_auth', 'true');
                document.getElementById('authOverlay').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                renderAdminProducts();
            } else {
                document.getElementById('authError').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('alshbib_admin_auth');
            location.reload();
        }

        function getProducts() {
            const saved = localStorage.getItem('alshbib_products');
            return saved ? JSON.parse(saved) : [];
        }

        function saveProduct(e) {
            e.preventDefault();
            const products = getProducts();
            const newProd = {
                id: Date.now(),
                name: document.getElementById('pName').value,
                category: document.getElementById('pCat').value,
                originalPrice: Number(document.getElementById('pOrig').value),
                discountPrice: Number(document.getElementById('pDisc').value),
                image: document.getElementById('pImg').value,
                badge: document.getElementById('pBadge').value
            };
            products.unshift(newProd);
            localStorage.setItem('alshbib_products', JSON.stringify(products));
            document.getElementById('productForm').reset();
            renderAdminProducts();
        }

        function deleteProduct(id) {
            if (confirm('هل أنت تأكد من حذف هذا المنتج؟')) {
                let products = getProducts();
                products = products.filter(p => p.id !== id);
                localStorage.setItem('alshbib_products', JSON.stringify(products));
                renderAdminProducts();
            }
        }

        function renderAdminProducts() {
            const products = getProducts();
            const container = document.getElementById('adminProductsList');
            if (products.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500">لا يوجد منتجات حالياً.</p>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="bg-slate-800 p-3 rounded-xl flex items-center justify-between gap-4 border border-slate-700">
                    <div class="flex items-center gap-3">
                        <img src="${p.image}" class="w-12 h-12 object-cover rounded-lg">
                        <div>
                            <h4 class="font-bold text-white text-xs">${p.name}</h4>
                            <p class="text-[10px] text-amber-400">$${p.discountPrice} <span class="text-slate-500 line-through">$${p.originalPrice}</span></p>
                        </div>
                    </div>
                    <button onclick="deleteProduct(${p.id})" class="text-red-400 hover:text-red-300 text-xs px-3 py-1.5 bg-red-500/10 rounded-lg">حذف</button>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('alshbib_admin_auth') === 'true') {
                document.getElementById('authOverlay').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                renderAdminProducts();
            }
        });
    </script>
</body>
</html>
